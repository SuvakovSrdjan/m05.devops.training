version: v1.0
name: Manual Promotion
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
blocks:
  - name: deploy canary
    task:
      jobs:
        - name: Deploy Canary
          commands:
            - checkout
            - mkdir -p ~/.kube
            - 'wget https://gist.githubusercontent.com/TomFern/c6121c6d7fd72faeb5b7cf0ce5a0e002/raw/9e86a4ca3ac8c8df6aa34cc661f1410711aef8bd/config -O ~/.kube/config'
            - cd 3-canary-deployment
            - kubectl create namespace "g1" || true
            - kubectl config set-context --current --namespace="g1"
            - kubectl apply -f deployment-canary.yml
            - kubectl rollout status deployment/flask-app-canary
  - name: verify canary
    task:
      jobs:
        - name: verify canary
          commands:
            - kubectl config set-context --current --namespace="g1"
            - kubectl get svc flask-app
      secrets:
        - name: kubeconfig
