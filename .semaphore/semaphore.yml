version: v1.0
name: "\U0001F34E Xcode CI Pipeline"
agent:
  machine:
    type: a2-standard-4
    os_image: macos-xcode16
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
      - brew install xcpretty
      - gem install xcpretty-junit-formatter
      - cache restore
      - bundle install
blocks:
  - name: Build and push Image
    dependencies: []
    task:
      jobs:
        - name: Install Dependencies
          commands:
            - checkout
  - name: Deploy to Kubernetes
    dependencies:
      - Build and push Image
    task:
      jobs:
        - name: SwiftLint
          commands:
            - echo hello
  - name: Verify
    dependencies:
      - Deploy to Kubernetes
    task:
      jobs:
        - name: Run Unit Tests
          commands:
            - echo hello
      epilogue:
        always:
          commands:
            - test-results publish unit-tests.xml
after_pipeline:
  task:
    jobs:
      - name: "Merge Reports \U0001F4CA"
        commands:
          - test-results gen-pipeline-report
promotions:
  - name: Deploy to TestFlight
    pipeline_file: testflight-deploy.yml
    auto_promote:
      when: branch = 'main' AND result = 'passed'
