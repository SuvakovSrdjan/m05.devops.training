version: v1.0
name: Kubernetes Test
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: Build and push Image
    dependencies: []
    task:
      jobs:
        - name: Build docker image
          commands:
            - checkout
            - cd 1-deployment
            - echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            - 'docker build -t $DOCKERHUB_USERNAME/my-flask-image:latest .'
            - 'docker push $DOCKERHUB_USERNAME/my-flask-image:latest'
      secrets:
        - name: Srdjan_Docker
  - name: Deploy to Kubernetes
    dependencies:
      - Build and push Image
    task:
      jobs:
        - name: Deploy to Kubernetes
          commands:
            - checkout
            - mkdir -p ~/.kube
            - 'wget https://gist.githubusercontent.com/TomFern/c6121c6d7fd72faeb5b7cf0ce5a0e002/raw/9e86a4ca3ac8c8df6aa34cc661f1410711aef8bd/config -O ~/.kube/config'
            - cd 1-deployment
            - kubectl create namespace "g1" || true
            - kubectl config set-context --current --namespace="g1"
            - kubectl apply -f deployment.yml
            - kubectl apply -f service.yml
            - kubectl rollout status deployment/flask-app
      secrets:
        - name: Srdjan_Docker
  - name: Verify
    dependencies:
      - Deploy to Kubernetes
    task:
      jobs:
        - name: Run Unit Tests
          commands:
            - kubectl config set-context --current --namespace="g1"
            - kubectl get svc flask-app
after_pipeline:
  task:
    jobs:
      - name: 'Job #1'
        commands: []
promotions:
  - name: Promotion 1
    pipeline_file: pipeline_2.yml
